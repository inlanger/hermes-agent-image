# Builds the image and publishes it to GitHub's container registry: on every push, by hand, and every 3 hours when
# Hermes has a new release, SearXNG a new commit or Ubuntu a new image, or a new week has begun (Ubuntu's package
# updates). A check with nothing new publishes nothing, so hosts keep the image they have. Unchanged layers come from
# the build cache (kept in the registry, as the :buildcache tag) and keep their digests: a new SearXNG means a new
# SearXNG layer, not a new 1.2 GB Hermes layer.
name: build
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build even when nothing has changed
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # what the image would be made of now
      - id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Hermes' latest release, found the way its installer finds the one it installs (its main branch changes
          # many times a day, its releases every few days)
          hermes=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/NousResearch/hermes-agent/releases/latest | jq -r .tag_name) || hermes=""
          stable='^v(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if ! grep -Eq "$stable" <<< "$hermes"; then
            hermes=$(git ls-remote --tags --refs https://github.com/NousResearch/hermes-agent 'refs/tags/v*' \
              | sed 's#.*refs/tags/##' | grep -E "$stable" | sort -V | tail -n 1)
          fi
          [ -n "$hermes" ] || { echo "Hermes' latest release not found"; exit 1; }
          searxng=$(git ls-remote https://github.com/searxng/searxng HEAD | cut -f1)
          base=$(docker buildx imagetools inspect ubuntu:24.04 --raw | sha256sum | cut -c1-16)
          week=$(date -u +%G-%V)
          echo "hermes=$hermes" >> "$GITHUB_OUTPUT"
          echo "searxng=$searxng" >> "$GITHUB_OUTPUT"
          echo "week=$week" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "key=$hermes-$searxng-$base-$week-$(sha256sum Dockerfile | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "hermes $hermes, searxng $searxng, ubuntu $base, week $week"
      # a build of exactly this is already published (a marker kept in the Actions cache)
      - id: published
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.force)
        uses: actions/cache/restore@v4
        with:
          path: .published
          key: published-${{ steps.upstream.outputs.key }}
          lookup-only: true
      - if: steps.published.outputs.cache-hit == 'true'
        run: echo "Nothing new since the last build; nothing published."
      - if: steps.published.outputs.cache-hit != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.published.outputs.cache-hit != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APT_WEEK=${{ steps.upstream.outputs.week }}
            HERMES_RELEASE=${{ steps.upstream.outputs.hermes }}
            SEARXNG_COMMIT=${{ steps.upstream.outputs.searxng }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/hermes-agent-image:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/hermes-agent-image:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hermes-agent-image:latest
            ghcr.io/${{ github.repository_owner }}/hermes-agent-image:${{ steps.upstream.outputs.day }}
      - if: steps.published.outputs.cache-hit != 'true'
        run: mkdir -p .published && echo "${{ steps.upstream.outputs.key }}" > .published/key
      - if: steps.published.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .published
          key: published-${{ steps.upstream.outputs.key }}
